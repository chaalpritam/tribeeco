services:
  er-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tribe
      POSTGRES_PASSWORD: tribe
      POSTGRES_DB: tribe_er
    ports:
      - "5435:5432"
    volumes:
      - er-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribe -d tribe_er"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  hub-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tribe
      POSTGRES_PASSWORD: tribe
      POSTGRES_DB: tribe_hub
    ports:
      - "5436:5432"
    volumes:
      - hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribe -d tribe_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  er-pgdata:
  hub-pgdata:
